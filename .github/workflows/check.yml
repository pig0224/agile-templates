name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Validate template registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check registry consistency
        run: node scripts/check.mjs

      # CLI 发版后可启用（npm i -g @fcc/agile-cli 走完整校验）：
      # - name: Check via agile CLI
      #   run: |
      #     npm install -g @fcc/agile-cli
      #     agile template check --registry "$GITHUB_WORKSPACE"
