name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Validate template registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check registry consistency
        run: node scripts/check.mjs

      - name: Check via agile CLI
        run: |
          npm install -g fcc-agile-cli
          agile template check --registry "$GITHUB_WORKSPACE"
